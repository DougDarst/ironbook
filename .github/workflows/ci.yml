name: CI

on:
  # Pull requests are tested on every push to their branch; main is tested
  # again after each merge. (Running on every push as well would test each
  # PR commit twice.)
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Fail fast if something hangs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the version stamp counts commits (see src/lib/version.ts).
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run pb:setup
      - run: npx playwright install --with-deps webkit chromium
        timeout-minutes: 10
      - run: npm run test:all
      # CI retries a failed E2E test once; list any that only passed on retry.
      - name: Report flaky E2E tests
        if: always()
        run: node scripts/report-flaky.ts playwright-results.json
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
